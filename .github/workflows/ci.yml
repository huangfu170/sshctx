name: CI
on:
  pull_request:
  push:
    branches: [main, "feat/**"]

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - name: Clippy
        shell: bash
        run: |
          set +e
          output=$(cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1)
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            diagnostic=$(printf '%s\n' "$output" | tail -n 180)
            escaped=${diagnostic//'%'/'%25'}
            escaped=${escaped//$'\r'/'%0D'}
            escaped=${escaped//$'\n'/'%0A'}
            echo "::error title=Clippy failure::$escaped"
            exit "$code"
          fi
      - run: cargo test --workspace --all-features
      - name: Python agent tests
        run: python -m unittest discover -s remote-agent -p "test_*.py" -v
