[workspace]
resolver = "2"
members = [
  "crates/sshctx-budget",
  "crates/sshctx-cli",
  "crates/sshctx-protocol",
  "crates/sshctx-runtime",
  "crates/sshctx-ssh",
  "crates/sshctx-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/huangfu170/sshctx"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
bytes = "1.11.0"
clap = { version = "4.5.53", features = ["derive"] }
dirs = "6.0.0"
hex = "0.4.3"
ignore = "0.4.25"
regex = "1.12.2"
rmcp = { version = "=2.2.0", features = ["transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.8"
uuid = { version = "1.19.0", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

